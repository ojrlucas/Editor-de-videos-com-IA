name: Build APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup.sh
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: prazo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publica o APK em uma release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk prazo.apk
          gh release create "apk-${{ github.run_number }}" prazo.apk \
            --prerelease --title "Prazo APK #${{ github.run_number }}" \
            --notes "APK de teste gerado a partir de ${{ github.sha }}"
