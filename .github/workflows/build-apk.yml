name: Build APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [normal, dev, online]
    env:
      EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup.sh
      - run: flutter analyze --no-fatal-infos
        if: matrix.edition == 'normal'
      - run: flutter build apk --release --dart-define=EDITION=${{ matrix.edition }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk prazo-${{ matrix.edition }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: prazo-${{ matrix.edition }}
          path: prazo-${{ matrix.edition }}.apk

  release:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prazo-*
          merge-multiple: true
          path: apks
      - name: Publica os APKs em uma release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" apks/*.apk \
            --repo "${{ github.repository }}" --prerelease \
            --title "Prazo APKs #${{ github.run_number }}" \
            --notes "Normal (rede local), Dev (controla os celulares na rede) e Online. Commit ${{ github.sha }}"
